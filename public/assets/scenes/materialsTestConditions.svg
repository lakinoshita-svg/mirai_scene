<svg xmlns="http://www.w3.org/2000/svg" width="640" height="416" viewBox="0 0 640 416" role="img" aria-labelledby="title"><title id="title">予備試験の条件：材料と厚さが違い、試料は各一枚</title><style>text{font-family:'Yu Gothic','Meiryo',sans-serif;fill:#29253d;font-size:24px} .heading{font-weight:700;font-size:32px}.label{font-weight:700}.muted{fill:#635d71}</style><rect width="640" height="416" rx="24" fill="#fcfbfd"/><text x="32" y="48" class="heading">何が同じで、何が違う？</text><rect x="32" y="72" width="272" height="256" rx="16" fill="#F0E9FF" stroke="#dcd4e7" stroke-width="2"/><rect x="336" y="72" width="272" height="256" rx="16" fill="#F0E9FF" stroke="#dcd4e7" stroke-width="2"/><text x="56" y="112" class="label">材料 X</text><text x="360" y="112" class="label">材料 Y</text><rect x="64" y="152" width="208" height="16" fill="#7144B8"/><rect x="368" y="144" width="208" height="32" fill="#7144B8"/><text x="56" y="224" class="">厚さ 1 mm</text><text x="360" y="224" class="">厚さ 2 mm</text><text x="56" y="280" class="">試料：1 枚</text><text x="360" y="280" class="">試料：1 枚</text><text x="32" y="368" class="label">温度・測定方法は同じ</text><text x="32" y="400" class="muted">教材用の条件図／実在の試験結果ではありません</text></svg>
