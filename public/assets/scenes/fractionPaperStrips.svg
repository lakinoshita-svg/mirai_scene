<svg xmlns="http://www.w3.org/2000/svg" width="640" height="376" viewBox="0 0 640 376" role="img" aria-labelledby="title"><title id="title">同じ長さのテープを二等分と三等分した一つ分</title><style>text{font-family:'Yu Gothic','Meiryo',sans-serif;fill:#29253d;font-size:24px} .heading{font-weight:700;font-size:32px}.label{font-weight:700}.muted{fill:#635d71}</style><rect width="640" height="376" rx="24" fill="#fcfbfd"/><text x="32" y="48" class="heading">もとの長さは同じ</text><text x="32" y="96" class="label">2 分の 1</text><rect x="32" y="112" width="576" height="64" rx="0" fill="#fff" stroke="#29253d" stroke-width="2"/><rect x="32" y="112" width="288" height="64" fill="#F0E9FF" stroke="#29253d" stroke-width="2"/><text x="32" y="232" class="label">3 分の 1</text><rect x="32" y="248" width="576" height="64" fill="#fff" stroke="#29253d" stroke-width="2"/><rect x="32" y="248" width="192" height="64" fill="#F0E9FF" stroke="#29253d" stroke-width="2"/><path d="M416 248V312" stroke="#29253d" stroke-width="2"/><text x="32" y="352" class="muted">色が付いている部分が、それぞれの一つ分</text></svg>
