<svg xmlns="http://www.w3.org/2000/svg" width="640" height="440" viewBox="0 0 640 440" role="img" aria-labelledby="title"><title id="title">カートの持ち手の形。Aは横棒、Bは左右の縦棒</title><style>text{font-family:'Yu Gothic','Meiryo',sans-serif;fill:#29253d;font-size:24px} .heading{font-weight:700;font-size:32px}.label{font-weight:700}.muted{fill:#635d71}</style><rect width="640" height="440" rx="24" fill="#fcfbfd"/><text x="32" y="48" class="heading">持ち手の形を比べる</text><rect x="32" y="72" width="272" height="280" rx="16" fill="#ffffff" stroke="#dcd4e7" stroke-width="2"/><text x="56" y="112" class="label">A：横棒</text><g stroke="#7144B8" stroke-width="12" stroke-linecap="round"><path d="M96 264V152M240 264V152"/><path d="M96 152H240"/></g><rect x="72" y="248" width="192" height="40" rx="8" fill="#F0E9FF" stroke="#7144B8" stroke-width="4"/><circle cx="104" cy="312" r="16" fill="#29253d"/><circle cx="232" cy="312" r="16" fill="#29253d"/><rect x="336" y="72" width="272" height="280" rx="16" fill="#ffffff" stroke="#dcd4e7" stroke-width="2"/><text x="360" y="112" class="label">B：左右の縦棒</text><g stroke="#7144B8" stroke-width="12" stroke-linecap="round"><path d="M400 264V152M544 264V152"/></g><rect x="376" y="248" width="192" height="40" rx="8" fill="#F0E9FF" stroke="#7144B8" stroke-width="4"/><circle cx="408" cy="312" r="16" fill="#29253d"/><circle cx="536" cy="312" r="16" fill="#29253d"/><text x="32" y="392" class="label">カート本体・試験条件は共通</text><text x="32" y="424" class="muted">形の比較図／寸法や強度を示す図ではありません</text></svg>
