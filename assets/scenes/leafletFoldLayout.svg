<svg xmlns="http://www.w3.org/2000/svg" width="640" height="400" viewBox="0 0 640 400" role="img" aria-labelledby="title"><title id="title">三つ折り案内の内側の配置例。中央の案内文が折り目に近い</title><style>text{font-family:'Yu Gothic','Meiryo',sans-serif;fill:#29253d;font-size:24px} .heading{font-weight:700;font-size:32px}.label{font-weight:700}.muted{fill:#635d71}</style><rect width="640" height="400" rx="24" fill="#fcfbfd"/><text x="32" y="48" class="heading">折り目と、案内文の位置</text><rect x="32" y="88" width="576" height="232" fill="#fff" stroke="#dcd4e7" stroke-width="2"/><rect x="48" y="112" width="128" height="80" rx="8" fill="#F0E9FF"/><text x="48" y="232" class="label">施設の紹介</text><text x="248" y="136" class="label">利用の案内</text><text x="264" y="192" class="">受付は入口へ</text><text x="264" y="232" class="">お越しください</text><text x="440" y="136" class="label">交通案内</text><path d="M224 80V336M416 80V336" fill="none" stroke="#7144B8" stroke-width="3" stroke-dasharray="8 8"/><text x="32" y="376" class="muted">破線は折り目／余白の推奨寸法を示す図ではありません</text></svg>
