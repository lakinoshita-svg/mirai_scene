# 既存のルーティング規則より前へ追記。RewriteEngine Onは既存設定を使用。
# 静的ファイルとHTMLカード断片はPHPへ送らず、Apacheから配信する。
RewriteRule ^mirai_scene/_astro/(.*)$ /new/_app/_webroot/js/page/miraiscene/$1 [L]
RewriteRule ^mirai_scene/((?:assets|catalog|integration)/.*|favicon\.svg)$ /new/_app/_webroot/miraiscene/$1 [L]
RewriteRule ^mirai_scene/?$ /new/_app/_webroot/miraiscene/index [QSA,L]
RewriteRule ^mirai_scene/(.*)$ /new/_app/_webroot/miraiscene/index?mirai_path=$1 [QSA,L]
